services:
  llmconduit:
    build:
      context: .
      dockerfile: Dockerfile
    image: llmconduit:latest
    container_name: llmconduit
    ports:
      - "${PROXY_PORT:-8000}:${PROXY_PORT:-8000}"
    volumes:
      # CONFIG_FILE lets you keep real backends in a gitignored config.local.yaml
      - ./${CONFIG_FILE:-config.yaml}:/etc/llmconduit/config.yaml:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:${PROXY_PORT:-8000}/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
